<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - IsChrisVaping</title>
    <link rel="stylesheet" href="palette.css">
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <!-- Login -->
    <div class="login-container" id="login-container">
        <div class="login-box">
            <h1>&#128274; Admin Dashboard</h1>
            <form id="login-form">
                <label for="password-input" class="visually-hidden">Admin password</label>
                <input type="password" id="password-input" placeholder="Enter admin password" autocomplete="current-password">
                <button type="submit">Login</button>
            </form>
            <p class="login-error" id="login-error"></p>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <header>
            <h1>IsChrisVaping Admin</h1>
            <button id="logout-btn">Logout</button>
        </header>
        <div class="container">
            <!-- Device Management -->
            <div class="card">
                <h2>Device Management</h2>
                <div class="table-scroll">
                    <table class="device-table">
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Name</th>
                                <th>Last Event</th>
                                <th>Last Updated</th>
                                <th>Events</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="device-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Events Modal -->
    <div class="modal-overlay" id="events-modal">
        <div class="modal">
            <button class="modal-close" id="modal-close">&times;</button>
            <h2 id="modal-title">Device Events</h2>
            <ul class="events-list" id="events-list"></ul>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
