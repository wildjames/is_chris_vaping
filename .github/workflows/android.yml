name: Build and Distribute Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Determine version bump
        id: bump
        run: |
          MSG=$(git log -1 --pretty=%s)
          if [[ "$MSG" =~ ^MAJOR ]]; then
            echo "type=MAJOR" >> $GITHUB_OUTPUT
          elif [[ "$MSG" =~ ^MINOR ]]; then
            echo "type=MINOR" >> $GITHUB_OUTPUT
          elif [[ "$MSG" =~ ^PATCH ]]; then
            echo "type=PATCH" >> $GITHUB_OUTPUT
          else
            echo "::error::Commit message must start with MAJOR, MINOR, or PATCH"
            exit 1
          fi

      - name: Get current version from server and bump
        id: version
        run: |
          RESPONSE=$(curl -sf "${{ secrets.SERVER_URL }}/app/latest" || echo '{}')
          CURRENT=$(echo "$RESPONSE" | jq -r '.version // "0.0.0"')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.bump.outputs.type }}" in
            MAJOR) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            MINOR) MINOR=$((MINOR + 1)); PATCH=0 ;;
            PATCH) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printenv GOOGLE_SERVICES_JSON > android/app/google-services.json

      - name: Build release APK
        working-directory: android
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: beta-testers
          file: android/app/build/outputs/apk/release/app-release.apk
          releaseNotes: |
            v${{ steps.version.outputs.version }}
            ${{ github.event.head_commit.message }}
